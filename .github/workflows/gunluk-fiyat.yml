name: Günlük fiyat çekimi

# Marketler fiyatlarını her sabah ~09:25'te (TRT) güncelliyor.
# Biz 10:00 TRT = 07:00 UTC'de çekiyoruz ki taze veriyi yakalayalım.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:        # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: write

concurrency:
  group: fiyat-cekimi
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Veritabanini calistirmalar arasinda saklar.
      #
      # Bu olmadan her calistirma sifir katalogla baslardi ve 13 bin urunu
      # her gun bastan taramak saatler surerdi. Onbellekle katalog BIRIKIR:
      # her gun sepet taze cekilir, ustune tam taramanin bir parcasi eklenir,
      # birkac gun icinde katalogun tamami olusur ve orada kalir.
      #
      # Anahtar her calistirmada degisir, restore-keys en son kaydi geri
      # yukler -- boylece kayit uzerine yazilir, eskiler dusmez.
      - name: Veritabanını geri yükle
        uses: actions/cache@v4
        with:
          path: fiyatlar.db
          key: fiyatlar-db-${{ github.run_id }}
          restore-keys: |
            fiyatlar-db-

      # 1) Sepetteki urunler HER GUN taze cekilir.
      - name: Sepeti çek
        run: python topla.py

      # 2) Tam katalog taramasi kaldigi yerden bir miktar ilerletilir.
      #    Pazar gunleri kuyruk sifirlanir ki uzun kuyruk da tazelensin.
      - name: Katalog taramasını sürdür
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            echo "Pazar -- tarama kuyruğu sıfırlanıyor"
            python topla.py --hepsi --sifirla --sinir 300
          else
            python topla.py --hepsi --sinir 300
          fi

      # 3) Ozdilek Bolu magazasi. marketfiyati'de yok; kendi acik API'sinden
      #    cekiliyor. Fiyatlar magazaya ozel (Bolu ile Bursa farkli).
      - name: Özdilek Bolu fiyatlarını çek
        run: python ozdilek.py
        continue-on-error: true      # Ozdilek duserse gunluk cekim aksamasin

      # 4) Bizim Toptan. Sunucu tarafinda render edildigi icin API gerekmiyor.
      - name: Bizim Toptan fiyatlarını çek
        run: python bizimtoptan.py
        continue-on-error: true

      - name: Alışveriş sayfasını üret
        run: python katalog.py

      - name: Sayfayı yayına kopyala
        run: |
          mkdir -p docs
          cp cikti/Market-Sepet.html docs/index.html

      - name: Değişiklikleri işle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Fiyatlarda değişiklik yok."
            exit 0
          fi
          git commit -m "Fiyat güncellemesi $(date -u +'%Y-%m-%d')"

          # Cekim ~1 saat surdugu icin bu sirada depoya baska bir commit
          # girmis olabilir (elle yapilan bir push gibi). O zaman dogrudan
          # push reddedilir. Once uzaktakinin ustune tasiyip tekrar deniyoruz.
          for deneme in 1 2 3; do
            if git push; then
              echo "Gonderildi (deneme $deneme)."
              exit 0
            fi
            echo "Push reddedildi, uzaktaki degisiklikler alinip tekrar denenecek..."
            git pull --rebase origin main || exit 1
          done
          echo "Uc denemede de gonderilemedi."
          exit 1
